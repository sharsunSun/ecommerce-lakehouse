[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce_lakehouse"
version = "0.1.0"
description = "Ecommerce Lakeflow transformations and operational jobs"
requires-python = ">=3.10"
dependencies = ["sqlparse>=0.5.3,<0.6"]

[project.scripts]
initialize = "ecommerce_lakehouse.jobs.initialize:main"
publish_semantic = "ecommerce_lakehouse.jobs.publish_semantic:main"
maintain_delta = "ecommerce_lakehouse.jobs.maintain_delta:main"

[project.optional-dependencies]
dev = ["PyYAML>=6.0.2,<7", "build>=1.2,<2"]
spark = ["pyspark==4.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ecommerce_lakehouse*"]

[tool.setuptools.package-data]
ecommerce_lakehouse = ["sql/*.sql"]